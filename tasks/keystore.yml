---
- name: Create the keystore if it doesn't exist yet
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-keystore create
  args:
    creates: /etc/elasticsearch/elasticsearch.keystore

- name: Check if bootstrap password is set
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-keystore list
  register: _es_keystore
  changed_when: false

- name: Create Bootstrap password for elastic user
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-keystore add -x 'bootstrap.password'
  args:
    stdin: "{{ es_api_basic_auth_password }}"
  changed_when: false
  when:
    - _es_keystore is defined
    - ('bootstrap.password' not in _es_keystore.stdout_lines)
  no_log: true
  notify: Restart ElasticSearch

- name: Read current keystore values
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-keystore show {{ item.key }}
  changed_when: false
  loop: "{{ es_keystore_entries }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true
  register: _es_keystore_values
  when: item.key in _es_keystore.stdout_lines

- name: Add or update keystore entries
  ansible.builtin.command: /usr/share/elasticsearch/bin/elasticsearch-keystore add -x -f {{ item.item.key }}
  args:
    stdin: "{{ item.item.value }}"
  changed_when: true
  loop: "{{ _es_keystore_values.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  no_log: true
  notify: Restart ElasticSearch
  when: item is skipped or item.stdout != (item.item.value | string)

- name: Restart ElasticSearch now to ensure the Bootstrap password for elastic user is set
  ansible.builtin.meta: "flush_handlers"

- name: Wait for ElasticSearch to be running
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ es_http_port }}"
